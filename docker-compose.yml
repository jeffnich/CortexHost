services:
  qdrant:
    image: qdrant/qdrant:v1.20.2  # pinned; bump deliberately
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"

  mcp:
    build: ./services/mcp
    restart: unless-stopped
    depends_on: [qdrant]
    environment:
      - PORT=8080
      - MCP_BIND_HOST=0.0.0.0  # docker nets are IPv4; the '::' default is for Railway
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=memories
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORTEX_MCP_PATH_SECRET=${CORTEX_MCP_PATH_SECRET}
      - CORTEX_TENANT_ID=${CORTEX_TENANT_ID}
      - CORTEX_USER_ID=${CORTEX_USER_ID}
      - CORTEX_TZ=${CORTEX_TZ}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MCP_PORT:-8300}:8080"

  brief:
    build: ./services/brief
    restart: unless-stopped
    depends_on: [qdrant]
    environment:
      - PORT=8080
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=memories
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORTEX_TENANT_ID=${CORTEX_TENANT_ID}
      - CORTEX_USER_ID=${CORTEX_USER_ID}
      - CORTEX_USER_NAME=${CORTEX_USER_NAME}
      - CORTEX_USER_CONTEXT=${CORTEX_USER_CONTEXT}
      - CORTEX_USER_GOALS=${CORTEX_USER_GOALS}
      - BRIEF_PATH_SECRET=${BRIEF_PATH_SECRET}
      - BRIEF_HOUR_UTC=${BRIEF_HOUR_UTC}
      - BRIEF_MODEL=${BRIEF_MODEL}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - BRIEF_EMAIL_TO=${BRIEF_EMAIL_TO}
      - BRIEF_URL=${BRIEF_URL}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BRIEF_PORT:-8301}:8080"


  gateway:
    build: ./services/gateway
    restart: unless-stopped
    environment:
      - PORT=8080
      - GATEWAY_BIND_HOST=0.0.0.0
      - GATEWAY_OWNER_SECRET=${GATEWAY_OWNER_SECRET}
      - CORTEX_USER_NAME=${CORTEX_USER_NAME}
      - GATEWAY_PROFILE_PATH=${GATEWAY_PROFILE_PATH:-/app/profile.example.md}
      - CORTEX_TZ=${CORTEX_TZ}
      # Optional; blank = feature off. See docs/gateway.md.
      - GATEWAY_TAKES=${GATEWAY_TAKES:-}
      - GATEWAY_FREEBUSY_ICS_URL=${GATEWAY_FREEBUSY_ICS_URL:-}
      - GATEWAY_WORK_HOURS=${GATEWAY_WORK_HOURS:-09:00-17:00}
      - GATEWAY_WORK_DAYS=${GATEWAY_WORK_DAYS:-mon-fri}
      - GATEWAY_TRIAGE_SECRET=${GATEWAY_TRIAGE_SECRET:-}
      - GATEWAY_WAKE_URL=${GATEWAY_WAKE_URL:-}
      - GATEWAY_WAKE_TOKEN=${GATEWAY_WAKE_TOKEN:-}
      - GATEWAY_NOTIFY_EMAIL=${GATEWAY_NOTIFY_EMAIL:-}
      - GATEWAY_RESEND_API_KEY=${GATEWAY_RESEND_API_KEY:-}
      - GATEWAY_NTFY_URL=${GATEWAY_NTFY_URL:-}
      - GATEWAY_PINGS_PER_HOUR=${GATEWAY_PINGS_PER_HOUR:-10}
    volumes:
      - gateway_data:/data
      - ./gateway-profile.md:/app/gateway-profile.md:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-8303}:8080"

volumes:
  qdrant_data:
  gateway_data:
